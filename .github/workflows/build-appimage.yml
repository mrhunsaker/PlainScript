name: Build PlainScript AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm retry settings
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            build-essential \
            python3 \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Cache Theia plugins
        id: theia-plugins-cache
        uses: actions/cache@v4
        with:
          path: plugins
          key: ${{ runner.os }}-theia-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-theia-plugins-

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download Theia plugins
        if: steps.theia-plugins-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: npm run download:plugins

      - name: Build custom-ui
        run: npm run build --workspace=custom-ui

      - name: Build browser-app
        run: npm run build --workspace=browser-app

      - name: Build electron-app
        run: npm run build --workspace=electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Prepare plugins for electron-app
        run: npm run prepare:plugins --workspace=electron-app

      - name: Package AppImage
        run: npx electron-builder --linux AppImage
        working-directory: electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: plainscript-appimage
          path: electron-app/dist/*.AppImage
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: electron-app/dist/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm retry settings
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5

      - name: Cache Theia plugins
        id: theia-plugins-cache
        uses: actions/cache@v4
        with:
          path: plugins
          key: ${{ runner.os }}-theia-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-theia-plugins-

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download Theia plugins
        if: steps.theia-plugins-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: npm run download:plugins

      - name: Build custom-ui
        run: npm run build --workspace=custom-ui

      - name: Build browser-app
        run: npm run build --workspace=browser-app

      - name: Build electron-app
        run: npm run build --workspace=electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Prepare plugins for electron-app
        run: npm run prepare:plugins --workspace=electron-app

      - name: Package macOS (DMG + ZIP)
        run: npx electron-builder --mac dmg zip
        working-directory: electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plainscript-macos
          path: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm retry settings
        shell: pwsh
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5

      - name: Cache Theia plugins
        id: theia-plugins-cache
        uses: actions/cache@v4
        with:
          path: plugins
          key: ${{ runner.os }}-theia-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-theia-plugins-

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit

      - name: Download Theia plugins
        if: steps.theia-plugins-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: npm run download:plugins

      - name: Build custom-ui
        run: npm run build --workspace=custom-ui

      - name: Build browser-app
        run: npm run build --workspace=browser-app

      - name: Build electron-app
        shell: pwsh
        run: npm run build --workspace=electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Prepare plugins for electron-app
        run: npm run prepare:plugins --workspace=electron-app

      - name: Package Windows (NSIS + Portable)
        shell: pwsh
        run: npx electron-builder --win nsis portable
        working-directory: electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plainscript-windows
          path: electron-app/dist/*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: electron-app/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
