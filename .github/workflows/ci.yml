name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

env:
  # Skip native module rebuilds in CI (handled in release.yml)
  THEIA_SKIP_NATIVE_REBUILD: 1
  SKIP_THEIA_CHECK: 1
  HUSKY: 0

jobs:
  checks:
    name: Lint, Typecheck & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      audit_result: ${{ steps.audit.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-dev build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify workspace structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          test -f package.json
          test -d browser-app
          test -d custom-ui
          test -d electron-app

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --no-audit --ignore-scripts

      - name: Validate docs exist
        run: |
          test -f README.md
          test -f LICENSE

      - name: Run lint
        run: npm run lint

      - name: TypeScript checks
        run: npm run typecheck

      - name: Run npm audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

  frontend-build:
    name: Build Frontend Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-dev build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --no-audit --ignore-scripts

      - name: Build frontend workspaces only (skip electron native rebuilds)
        run:
          npx turbo run build --filter=...custom-ui --filter=...browser-app
          --filter='!(electron-app)'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          THEIA_SKIP_NATIVE_REBUILD: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            custom-ui/lib/
            browser-app/lib/
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs:
      - checks
      - frontend-build
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "Checks (lint/typecheck/docs): ${{ needs.checks.result }}"
          echo "npm audit: ${{ needs.checks.outputs.audit_result }}"
          echo "Frontend build: ${{ needs.frontend-build.result }}"

      - name: Fail if required jobs failed
        run: |
          if [[ "${{ needs.checks.result }}" != "success" ||
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "Required CI jobs failed."
            exit 1
          fi
