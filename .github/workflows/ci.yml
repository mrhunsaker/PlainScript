name: Code Quality & CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download Theia plugins
        run: npm run download:plugins

      - name: Build custom-ui
        run: npm run build --workspace=custom-ui

      - name: Build browser-app
        run: npm run build --workspace=browser-app

      - name: Build electron-app
        run: |
          export NODE_OPTIONS=--max_old_space_size=4096
          npm run build --workspace=electron-app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            custom-ui/lib/
            browser-app/lib/
            electron-app/lib/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run npm audit (non-blocking)
        run: npm audit --audit-level=moderate || true

      - name: Check for high/critical vulnerabilities
        run: |
          if npm audit --audit-level=high 2>&1 | grep -q 'high\|critical'; then
            echo "⚠️  High/Critical vulnerabilities found. Review before merging."
            npm audit --audit-level=high
            exit 1
          fi

  accessibility-check:
    name: Accessibility & Documentation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Verify governance files exist
        run: |
          echo "Checking governance files..."
          test -f CODE_OF_CONDUCT.md && echo "✓ CODE_OF_CONDUCT.md" || (echo "✗ CODE_OF_CONDUCT.md missing" && exit 1)
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md" || (echo "✗ CONTRIBUTING.md missing" && exit 1)
          test -f STYLE_GUIDE.md && echo "✓ STYLE_GUIDE.md" || (echo "✗ STYLE_GUIDE.md missing" && exit 1)
          test -f SECURITY.md && echo "✓ SECURITY.md" || (echo "✗ SECURITY.md missing" && exit 1)
          test -f README.md && echo "✓ README.md" || (echo "✗ README.md missing" && exit 1)
          echo "All governance files present."

      - name: Verify ESLint & Prettier config
        run: |
          echo "Checking quality tools..."
          test -f .eslintrc.json && echo "✓ .eslintrc.json" || (echo "✗ .eslintrc.json missing" && exit 1)
          test -f .prettierrc.json && echo "✓ .prettierrc.json" || (echo "✗ .prettierrc.json missing" && exit 1)
          test -f .prettierignore && echo "✓ .prettierignore" || (echo "✗ .prettierignore missing" && exit 1)
          echo "All quality tool configs present."

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, build, security-audit, accessibility-check]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "Lint & Format: ${{ needs.lint.result }}"
          echo "Build & Test: ${{ needs.build.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Accessibility & Docs: ${{ needs.accessibility-check.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" ]] || [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI/CD failed: Lint or build check failed"
            exit 1
          fi

          echo "✅ All required checks passed"
