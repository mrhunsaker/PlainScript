name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

env:
  SKIP_THEIA_CHECK: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libglib2.0-dev python3 make g++

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libglib2.0-dev python3 make g++

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: TypeScript checks
        run: npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libgtk-3-dev libxss1 libnss3-dev libasound2-dev \
            libglib2.0-dev libxrandr-dev libxcomposite-dev \
            libxcursor-dev libxi-dev libxtst-dev \
            python3 make g++

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build custom-ui
        run: npm run build --workspace=custom-ui

      - name: Build browser-app
        run: npm run build --workspace=browser-app

      - name: Build electron-app
        run: npm run build --workspace=electron-app
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            custom-ui/lib/
            browser-app/lib/
            electron-app/lib/
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libglib2.0-dev python3 make g++

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=high

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README exists
        run: test -f README.md

      - name: Validate LICENSE exists
        run: test -f LICENSE

  summary:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - frontend-build
      - security-audit
      - docs-check

    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Typecheck: ${{ needs.typecheck.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Docs Check: ${{ needs.docs-check.result }}"

      - name: Fail if required jobs failed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" || \
                "${{ needs.docs-check.result }}" != "success" ]]; then
            echo "Required CI jobs failed."
            exit 1
          fi
