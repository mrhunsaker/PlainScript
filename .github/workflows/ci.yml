name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

env:
  SKIP_THEIA_CHECK: 1
  HUSKY: 0

jobs:
  checks:
    name: Lint, Typecheck & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      audit_result: ${{ steps.audit.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify workspace structure
        run: |
          pwd
          ls -la
          test -d browser-app
          test -d custom-ui
          test -d electron-app
          test -f package.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --no-audit --ignore-scripts

      - name: Validate docs exist
        run: |
          test -f README.md
          test -f LICENSE

      - name: Run lint
        run: npm run lint

      - name: TypeScript checks - all workspaces
        run: npm run typecheck --workspaces

      - name: Run npm audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

  frontend-build:
    name: Build Frontend Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --no-audit --ignore-scripts

      - name: Build all workspaces (turbo)
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            custom-ui/lib/
            browser-app/lib/
            electron-app/lib/
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs:
      - checks
      - frontend-build
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "Checks (lint/typecheck/docs): ${{ needs.checks.result }}"
          echo "npm audit: ${{ needs.checks.outputs.audit_result }}"
          echo "Frontend build: ${{ needs.frontend-build.result }}"

      - name: Fail if required jobs failed
        run: |
          if [[ "${{ needs.checks.result }}" != "success" ||
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "Required CI jobs failed."
            exit 1
          fi
