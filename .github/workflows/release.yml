name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SKIP_THEIA_CHECK: 1
  ELECTRON_CACHE: ${{ github.workspace }}/electron-app/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/electron-app/.cache/electron-builder

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
            build_cmd: npm run package:linux --workspace=electron-app
            artifact_path: dist/*.AppImage

          - os: macos-latest
            artifact_name: macos
            build_cmd: npm run package:mac --workspace=electron-app
            artifact_path: |
              dist/*.dmg
              dist/*.zip

          - os: windows-latest
            artifact_name: windows
            build_cmd: npm run package:win --workspace=electron-app
            artifact_path: |
              dist/*.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # NOTE: no global `defaults.run.working-directory` here.
    # This is an npm-workspaces monorepo (root package.json defines the
    # "browser-app" / "custom-ui" / "electron-app" workspaces, and the only
    # package-lock.json lives at the repo root). Every step below runs from
    # the repo root, exactly like scripts/build-appimage-clean.sh and
    # ci.yml do. Only the final packaging step is scoped to electron-app.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            python3 \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libxtst-dev \
            libnss3-dev \
            libcups2-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libgtk-3-dev \
            libdrm-dev \
            libgbm-dev \
            p7zip-full

      - name: Cache Electron + Plugins
        uses: actions/cache@v4
        with:
          path: |
            electron-app/.cache/electron
            electron-app/.cache/electron-builder
            plugins
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download plugins
        run: npm run download:plugins

      # turbo.json encodes that browser-app/electron-app depend on custom-ui
      # and runs independent build tasks in parallel - run from the repo
      # root so turbo actually sees the full workspace graph.
      - name: Build all workspaces (turbo)
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Prepare plugins
        run: npm run prepare:plugins --workspace=electron-app

      - name: Package application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plainscript-${{ matrix.artifact_name }}
          path: electron-app/${{ matrix.artifact_path }}
          retention-days: 30

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/${{ matrix.artifact_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
